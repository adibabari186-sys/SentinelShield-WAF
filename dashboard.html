<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelShield - Incident Dashboard</title>
    <!-- Simple CDN for rendering security charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .metrics-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            flex: 1;
        }
        .card h3 {
            margin-top: 0;
            color: #94a3b8;
            font-size: 14px;
        }
        .card .metric {
            font-size: 28px;
            font-weight: bold;
            color: #f43f5e;
        }
        .chart-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 500px;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
        }
        tr:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <h1>SentinelShield Security Operations Dashboard</h1>

    <div class="metrics-container">
        <div class="card">
            <h3>TOTAL ALERTS TRIGGERED</h3>
            <div class="metric" id="totalAlerts">0</div>
        </div>
        <div class="card">
            <h3>MOST COMMON THREAT</h3>
            <div class="metric" id="topThreat" style="color:#f59e0b;">-</div>
        </div>
        <div class="card">
            <h3>ACTIVE BLOCKED IP</h3>
            <div class="metric" id="activeIp" style="color:#38bdf8;">127.0.0.1</div>
        </div>
    </div>

    <div class="chart-box">
        <h3 style="margin-top: 0; color: #cbd5e1;">Attack Type Distribution</h3>
        <canvas id="attackChart"></canvas>
    </div>

    <h2>Recent Security Logs</h2>
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Source IP</th>
                <th>Threat Category</th>
                <th>Target Endpoint</th>
            </tr>
        </thead>
        <tbody id="logsTableBody">
            <!-- Dynamic data injected by script -->
        </tbody>
    </table>

    <script>
        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();

                document.getElementById('totalAlerts').innerText = data.total_events;
                document.getElementById('topThreat').innerText = data.top_threat || 'None';

                // Render Logs Table
                const tbody = document.getElementById('logsTableBody');
                tbody.innerHTML = '';
                
                data.recent_logs.reverse().forEach(log => {
                    const row = `<tr>
                        <td>${log.time}</td>
                        <td>${log.ip}</td>
                        <td><b style="color:#f43f5e;">${log.threat}</b></td>
                        <td>${log.path}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });

                // Render Chart
                const ctx = document.getElementById('attackChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.threat_counts),
                        datasets: [{
                            data: Object.values(data.threat_counts),
                            backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: '#e2e8f0' } } }
                    }
                });

            } catch (err) {
                console.error("Failed loading dashboard metrics:", err);
            }
        }

        fetchMetrics();
    </script>
</body>
</html>
